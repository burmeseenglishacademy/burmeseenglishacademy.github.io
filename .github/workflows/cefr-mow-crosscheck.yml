name: A1 Myanmar Open Wordnet weak reference alignment
on:
  push:
    branches: [cefr-5000-bilingual-qa-staging]
    paths:
      - .github/workflows/cefr-mow-crosscheck.yml
      - draft/UNVERIFIED_CEFR_CANDIDATES.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install reference NLTK WordNet
        run: |
          python -m pip install 'nltk==3.9.1'
          python - <<'PY'
          import nltk
          assert nltk.download('wordnet')
          PY
      - name: Obtain openly licensed Myanmar WordNet reference
        run: |
          mkdir -p scratch
          curl -fLsS --retry 3 -o scratch/mow-0.1.3-mya_20171005165336.tab https://raw.githubusercontent.com/myanmaropenwordnet/mow/master/mow-0.1.3-mya_20171005165336.tab
          test $(stat -c%s scratch/mow-0.1.3-mya_20171005165336.tab) -gt 10000
      - name: Match only candidate word senses and preserve unverified status
        run: |
          python tools/check_mow_a1.py
          python - <<'PY'
          import json
          p=json.load(open('draft/A1-MOW-WEAK-CROSSCHECK.json'))
          starters=json.load(open('draft/A1-EDITORIAL-STARTER.json'))
          assert len(p['entries'])==len(starters['entries'])
          assert all(x['reviewed_burmese'] is False for x in p['entries'])
          print('PASS: no translation falsely approved')
          PY
      - name: Retain cross-check report for editorial review, do not publish
        uses: actions/upload-artifact@v4
        with:
          name: A1-MOW-weak-reference-NOT-VERIFIED
          path: draft/A1-MOW-WEAK-CROSSCHECK.json
          retention-days: 14
