name: CEFR 5000 candidate-source audit (no publication)
on:
  push:
    branches: [cefr-5000-bilingual-qa-staging]
    paths:
      - .github/workflows/cefr-source-audit.yml
      - tools/prepare_cefr_candidates.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit-public-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frequency and lexical references
        run: |
          python -m pip install 'wordfreq==3.1.1' 'nltk==3.9.1'
          python - <<'PY'
          import nltk
          assert nltk.download('wordnet')
          PY
      - name: Prepare offline review-only 5000-word shortlist
        run: python tools/prepare_cefr_candidates.py --out draft/cefr-candidates.json
      - name: Verify no unreviewed bilingual content can leak into production
        run: |
          python - <<'PY'
          import collections,json
          d=json.load(open('draft/cefr-candidates.json'))
          assert d['release_status']=='UNVERIFIED_DRAFT_DO_NOT_PUBLISH'
          assert len(d['entries'])==5000
          assert len({x['word'] for x in d['entries']})==5000
          assert collections.Counter(x['level'] for x in d['entries'])==d['targets']
          assert all(not x['burmese_meaning'] for x in d['entries'])
          assert all(not x['reviewed_burmese'] for x in d['entries'])
          print('PASS: 5000 source candidates exist; missing Myanmar translations correctly blocked')
          PY
      - name: Persist explicitly unverified candidates to staging branch
        run: |
          mkdir -p draft
          cp draft/cefr-candidates.json draft/UNVERIFIED_CEFR_CANDIDATES.json
          rm draft/cefr-candidates.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add draft/UNVERIFIED_CEFR_CANDIDATES.json
          if ! git diff --cached --quiet; then
            git commit -m "Archive 5000 unverified CEFR headword candidates for editorial review"
            git push origin HEAD:cefr-5000-bilingual-qa-staging
          fi
      - name: Retain review candidates as CI artifact only — never publish
        uses: actions/upload-artifact@v4
        with:
          name: cefr-5000-source-candidates-UNVERIFIED
          path: draft/UNVERIFIED_CEFR_CANDIDATES.json
          retention-days: 14
