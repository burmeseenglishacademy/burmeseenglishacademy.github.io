# Legacy 5,000-candidate generator RETIRED for the user-approved 1,000-total scope.
# Keep this historical workflow path as a no-write staging guard. Branch name is unchanged.
name: CEFR 1000 source-scope guard (staging only; no writes)
on:
  push:
    branches: [cefr-5000-bilingual-qa-staging]
    paths:
      - .github/workflows/cefr-source-audit.yml
      - draft/CEFR-1000-PROVISIONAL-SHORTLIST.json
      - draft/CEFR-1000-INDEPENDENT-REVIEW-TASKS.json
      - tools/audit_cefr_1000_shortlist.py
      - tools/audit_cefr_1000_oxford_coverage.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  approved-1000-scope-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Require frozen 200-per-level, zero independently approved shortlist
        run: python3 tools/audit_cefr_1000_shortlist.py --level ALL --self-test
      - name: Reconcile actual Oxford publisher word/POS research without approval
        run: python3 tools/audit_cefr_1000_oxford_coverage.py --level ALL --self-test
      - name: Reject legacy 5000 source generation or publication
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('draft/CEFR-1000-PROVISIONAL-SHORTLIST.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          assert data['scope_target']=={x:200 for x in ('A1','A2','B1','B2','C1')}
          assert len(data['entries'])==1000
          assert data['independently_approved_by_level']=={x:0 for x in ('A1','A2','B1','B2','C1')}
          assert all(x['editorial_hold'] is True and x['release_approved'] is False for x in data['entries'])
          assert 'UNVERIFIED_DRAFT_DO_NOT_PUBLISH' in Path('cefr-vocabulary-data.js').read_text(encoding='utf-8')
          print('PASS: user-approved 1000 only; no legacy 5000 generator, repository writes or deployment')
          PY
