name: Preview next CEFR A2–C1 draft words (staging only)
on:
  push:
    branches: [cefr-5000-bilingual-qa-staging]
    paths:
      - tools/list_cefr_next_candidates.py
      - .github/workflows/cefr-preview-next.yml
      - draft/A2-C1-EDITORIAL-STARTER.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Preview up to 200 unreviewed provisional candidates per level (staging only)
        run: python3 tools/list_cefr_next_candidates.py --limit 200
