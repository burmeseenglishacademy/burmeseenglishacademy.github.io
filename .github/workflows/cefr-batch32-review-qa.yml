name: CEFR batch32 parallel draft and quarantine QA (never deploy)
on:
  push:
    branches: [cefr-5000-bilingual-qa-staging]
    paths:
      - draft/A2-C1-EDITORIAL-BATCH32.json
      - draft/A2-C1-REVIEW-TASKS-BATCH32.json
      - draft/A2-C1-QUARANTINE-BATCH32.json
      - tools/audit_cefr_batch32_review_tasks.py
      - .github/workflows/cefr-batch32-review-qa.yml
      - CEFR-A2-C1-BATCH32-CHECKPOINT-2026-10-25.md
  workflow_dispatch:
permissions:
  contents: read
jobs:
  level-structural-review:
    strategy:
      fail-fast: false
      matrix:
        level: [A2, B1, B2, C1, ALL]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check unpublished batch32 drafts and quarantine
        run: python3 tools/audit_cefr_batch32_review_tasks.py --level ${{ matrix.level }}
