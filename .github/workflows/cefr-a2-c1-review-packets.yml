name: A2–C1 unpublished editorial packet preparation
on:
  push:
    branches: [cefr-5000-bilingual-qa-staging]
    paths:
      - .github/workflows/cefr-a2-c1-review-packets.yml
      - tools/build_cefr_a2_c1_review_packets.py
      - draft/UNVERIFIED_CEFR_CANDIDATES.json
      - draft/A2-C1-EDITORIAL-STARTER.json
      - draft/A2-C1-SOURCE-EVIDENCE-REVIEW.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare-work-packets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Prepare batches, retaining original drafts and independent approval requirements
        run: python3 tools/build_cefr_a2_c1_review_packets.py
      - name: Check 4500 candidates, preserve all draft progress and block premature release
        run: |
          python3 - <<'PY'
          from collections import Counter
          from pathlib import Path
          import json
          root=Path('scratch/cefr-a2-c1-work-packets')
          idx=json.loads((root/'INDEX.json').read_text('utf8'))
          starter=json.loads(Path('draft/A2-C1-EDITORIAL-STARTER.json').read_text('utf8'))
          originals={e['word']:e for e in starter['entries']}
          evidence=json.loads(Path('draft/A2-C1-SOURCE-EVIDENCE-REVIEW.json').read_text('utf8'))
          observations={e['word']:e for e in evidence['records']}
          assert idx['status']=='A2_C1_UNVERIFIED_WORK_QUEUE_ONLY'
          assert idx['publication_allowed'] is False
          assert idx['total_candidates']==4500
          assert idx['total_batches']==45
          assert idx['unverified_original_first_drafts']==len(originals)
          assert idx['missing_first_drafts']==4500-len(originals)
          assert idx['source_observations']==len(observations)
          assert idx['source_level_conflicts']==sum(e['provisional_level_conflicts_with_source'] for e in observations.values())
          seen=set();by_level=Counter();covered_drafts=set();covered_evidence=set()
          for info in idx['batches']:
              d=json.loads((root/info['path']).read_text('utf8'))
              assert d['release_status']=='UNVERIFIED_DRAFT_DO_NOT_PUBLISH'
              assert len(d['entries'])==info['candidate_count']
              for row in d['entries']:
                  assert row['word'] not in seen
                  seen.add(row['word'])
                  by_level[row['provisional_level']]+=1
                  assert not row['source_english']
                  assert not row['source_burmese']
                  assert not row['source_level']
                  for field in ('reviewed_english','reviewed_burmese','reviewed_example','reviewed_level','reviewed_pronunciation'):
                      assert row[field] is False
                  if row['word'] in observations:
                      observation=observations[row['word']]
                      covered_evidence.add(row['word'])
                      assert row['source_observation_unverified']['dictionary_url']==observation['source_url']
                      assert row['source_observation_unverified']['dictionary_sense_level']==observation['source_sense_level']
                      assert row['source_observation_unverified']['independently_approved'] is False
                      assert row['provisional_level_conflict']==observation['provisional_level_conflicts_with_source']
                  else:
                      assert row['source_observation_unverified'] is None
                      assert row['provisional_level_conflict'] is False
                  if row['word'] in originals:
                      original=originals[row['word']]
                      covered_drafts.add(row['word'])
                      assert row['status']=='AI_ASSISTED_DRAFT_PENDING_INDEPENDENT_REVIEW'
                      for field in ('english_definition','burmese_meaning','example_sentence','part_of_speech'):
                          assert row[field]==original[field]
                  else:
                      assert row['status']=='EDITORIAL_WORK_QUEUE_NOT_APPROVED'
                      assert not row['english_definition']
                      assert not row['burmese_meaning']
                      assert not row['example_sentence']
          assert len(seen)==4500
          assert by_level==Counter({'A2':700,'B1':1000,'B2':1300,'C1':1500})
          assert covered_drafts==set(originals)
          assert covered_evidence==set(observations)
          print('PASS: 45 packets, 4500 unique candidates, original bilingual drafts and word-specific source observations retained without false approval')
          PY
      - name: Store review packets off the public site
        uses: actions/upload-artifact@v4
        with:
          name: CEFR-A2-C1-4500-UNVERIFIED-EDITORIAL-PACKETS
          path: scratch/cefr-a2-c1-work-packets/
          retention-days: 30
          if-no-files-found: error
