name: CEFR batch20 parallel draft and quarantine QA (never deploy)
on:
  push:
    branches: [cefr-5000-bilingual-qa-staging]
    paths:
      - draft/A2-C1-EDITORIAL-BATCH20.json
      - draft/A2-C1-REVIEW-TASKS-BATCH20.json
      - draft/A2-C1-QUARANTINE-BATCH20.json
      - tools/audit_cefr_batch20_review_tasks.py
      - .github/workflows/cefr-batch20-review-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  level-structural-review:
    strategy:
      fail-fast: false
      matrix:
        level: [A2, B1, B2, C1, ALL]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check unpublished batch20 drafts
        run: python3 tools/audit_cefr_batch20_review_tasks.py --level ${{ matrix.level }}
