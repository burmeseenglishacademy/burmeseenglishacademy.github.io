name: CEFR batch17 unique-headword and five-way draft QA (never deploy)
on:
  push:
    branches: [cefr-5000-bilingual-qa-staging]
    paths:
      - draft/A2-C1-EDITORIAL-BATCH17.json
      - draft/A2-C1-REVIEW-TASKS-BATCH17.json
      - draft/A2-C1-QUARANTINE-BATCH17.json
      - tools/audit_cefr_batch17_review_tasks.py
      - .github/workflows/cefr-batch17-review-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  level-structural-review:
    strategy:
      fail-fast: false
      matrix:
        level: [A2, B1, B2, C1, ALL]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate unverified batch17 and cross-file exact counts
        run: python3 tools/audit_cefr_batch17_review_tasks.py --level ${{ matrix.level }}
