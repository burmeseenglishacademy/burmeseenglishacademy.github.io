name: CEFR batch67 55-proposal parallel structural QA (never deploy)
on:
  push:
    branches: [cefr-5000-bilingual-qa-staging]
    paths:
      - draft/A2-C1-SOURCE-RECOVERY-EDITORIAL-BATCH67.json
      - draft/A2-C1-SOURCE-RECOVERY-REVIEW-TASKS-BATCH67.json
      - draft/A2-C1-SOURCE-RECOVERY-QUARANTINE-BATCH67.json
      - tools/audit_cefr_batch67_recovery.py
      - tools/preflight_cefr_draft_candidates.py
      - draft/BATCH67-CANDIDATE-PREFLIGHT.txt
      - tools/shortlist_cefr_undrafted.py
      - .github/workflows/cefr-batch67-recovery-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-level-structural-audit:
    strategy:
      fail-fast: false
      matrix:
        level: [A2, B1, B2, C1, ALL]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Structural and reversible candidate quarantine (not linguistic approval)
        run: python3 tools/audit_cefr_batch67_recovery.py --level ${{ matrix.level }}
      - name: Preflight candidate-pool versus authored-duplicate semantics
        if: ${{ matrix.level == 'ALL' }}
        run: |
          python3 tools/preflight_cefr_draft_candidates.py --self-test
          python3 tools/preflight_cefr_draft_candidates.py --file draft/BATCH67-CANDIDATE-PREFLIGHT.txt --json > batch67-preflight-final.json
      - name: Generate risk-screened undrafted shortlist for next original batch
        if: ${{ matrix.level == 'ALL' }}
        run: python3 tools/shortlist_cefr_undrafted.py --limit 75
      - name: Guard production lessons IELTS audio and privacy
        if: ${{ matrix.level == 'ALL' }}
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin main
          changed="$(git diff --name-only origin/main HEAD -- content.js ielts-vocabulary-data.js audio-manifest.js audio-player.js audio-integration.js privacy-tools.js site-config.js audio/)"
          if [ -n "$changed" ]; then printf 'PRODUCTION ASSET DRIFT: %s\n' "$changed"; exit 1; fi
          echo 'PASS: protected production assets unchanged'
      - name: Archive reversible candidate quarantine
        if: ${{ matrix.level == 'ALL' }}
        uses: actions/upload-artifact@v4
        with:
          name: batch67-reversible-quarantine
          path: batch67-triage-results.json
          retention-days: 30
