name: CEFR batch55 parallel bilingual retier QA (never deploy)
on:
  push:
    branches: [cefr-5000-bilingual-qa-staging]
    paths:
      - draft/A2-C1-RETIER-EDITORIAL-BATCH55.json
      - draft/A2-C1-RETIER-REVIEW-TASKS-BATCH55.json
      - draft/A2-C1-RETIER-QUARANTINE-BATCH55.json
      - tools/audit_cefr_batch55_retier.py
      - .github/workflows/cefr-batch55-retier-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unpublished-structural-review:
    strategy:
      fail-fast: false
      matrix:
        level: [A2, B1, B2, C1, ALL]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Audit bilingual drafts and unapproved evidence tasks
        run: python3 tools/audit_cefr_batch55_retier.py --level ${{ matrix.level }}
      - name: Check protected production content and audio
        if: ${{ matrix.level == 'ALL' }}
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin main
          changed="$(git diff --name-only origin/main HEAD -- content.js ielts-vocabulary-data.js audio-manifest.js audio-player.js audio-integration.js privacy-tools.js site-config.js audio/)"
          if [ -n "$changed" ]; then
            printf 'PRODUCTION ASSET DRIFT: %s\n' "$changed"
            exit 1
          fi
          echo 'PASS: protected production lessons, IELTS, George/Emma audio and privacy unchanged'
