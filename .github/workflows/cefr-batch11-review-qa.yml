name: CEFR batch11 five-way draft and quarantine QA (never deploy)
on:
  push:
    branches: [cefr-5000-bilingual-qa-staging]
    paths:
      - draft/A2-C1-EDITORIAL-STARTER.json
      - draft/A2-C1-EDITORIAL-BATCH11.json
      - draft/A2-C1-REVIEW-TASKS-BATCH11.json
      - draft/A2-C1-CANDIDATE-QUARANTINE.json
      - tools/audit_cefr_batch11_review_tasks.py
      - .github/workflows/cefr-batch11-review-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  structure-and-quarantine-only:
    strategy:
      fail-fast: false
      matrix:
        level: [A2, B1, B2, C1, ALL]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Audit unverified drafts, evidence tasks and quarantined candidates
        run: python3 tools/audit_cefr_batch11_review_tasks.py --level ${{ matrix.level }}
