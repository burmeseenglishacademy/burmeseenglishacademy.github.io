name: CEFR-1000 staging structural QA
on:
  push:
    branches: [cefr-5000-bilingual-qa-staging]
    paths:
      - 'draft/CEFR-1000-*.json'
      - 'scripts/audit_cefr1000*.py'
      - 'scripts/cefr1000_provisional_lexical_audit.py'
      - 'scripts/cefr1000_release_gate.py'
      - 'scripts/cefr1000_staging_gate.py'
      - 'scripts/cefr1000_negative_tests.py'
      - 'tests/test_cefr1000*.py'
      - '.github/workflows/cefr1000-staging-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  provisional-level:
    name: Provisional structural QA ${{ matrix.level }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        level: [A1, A2, B1, B2, C1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 scripts/audit_cefr1000_provisional.py
      - name: Validate pending independent-review intake and immutable provenance
        run: python3 scripts/audit_cefr1000_review_intake.py
      - name: Run read-only lexical and provenance triage
        run: python3 scripts/cefr1000_provisional_lexical_audit.py draft/CEFR-1000-PROVISIONAL-SHORTLIST.json > /tmp/cefr1000-lexical-triage.json
      - name: Check lexical triage inventory (not editorial approval)
        run: |
          python3 - <<'PY'
          import json
          with open('/tmp/cefr1000-lexical-triage.json', encoding='utf-8') as handle:
              report = json.load(handle)
          assert report['classification'] == 'TRIAGE_NOT_INDEPENDENT_REVIEW'
          assert report['target_200_each_met']
          assert all(report['editorial_holds_by_level'][level] == 200 for level in ('A1','A2','B1','B2','C1'))
          print('Provisional inventory and holds intact; independent approval NOT established.')
          PY
      - run: python3 scripts/audit_cefr1000_level.py --level "${{ matrix.level }}"
      - name: Check synchronized shortlist/review mapping (not approval)
        run: python3 scripts/cefr1000_staging_gate.py --level "${{ matrix.level }}"
  fail-closed-negative-tests:
    name: Provisional corruption and release-refusal regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reject 20 corrupt inventories and reject provisional release
        run: python3 scripts/cefr1000_negative_tests.py
  adversarial:
    name: Adversarial structural regressions ${{ matrix.level }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        level: [A1, A2, B1, B2, C1]
    env:
      CEFR_QA_LEVEL: ${{ matrix.level }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m unittest discover -s tests -p 'test_cefr1000_*.py' -v
# IMPORTANT: green jobs certify provisional structure ONLY, never independent review or release.
