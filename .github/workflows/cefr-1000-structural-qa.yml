name: CEFR-1000 staging structural QA
on:
  push:
    branches:
      - cefr-5000-bilingual-qa-staging
    paths:
      - 'draft/CEFR-1000-*.json'
      - 'scripts/cefr1000_staging_gate.py'
      - 'scripts/cefr1000_negative_tests.py'
      - 'scripts/cefr-1000-level-structural-qa.cjs'
      - 'scripts/cefr-1000-release-readiness-gate.cjs'
      - '.github/workflows/cefr-1000-structural-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  structural:
    name: Structural integrity / ${{ matrix.level }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        level: [A1, A2, B1, B2, C1]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check provisional inventory and review-task integrity
        run: python scripts/cefr1000_staging_gate.py --level "${{ matrix.level }}"
  mutation-tests:
    name: Reject corrupted provisional data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run sixteen fail-closed mutation checks
        run: python scripts/cefr1000_negative_tests.py
  release-blocker:
    name: Assert unverified release remains blocked
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify release gate fails closed
        shell: bash
        run: |
          # A nonzero exit alone is insufficient: malformed JSON, missing files,
          # or a Python crash must NOT be mistaken for a successful release denial.
          python scripts/cefr1000_staging_gate.py > structural-check.json
          set +e
          python scripts/cefr1000_staging_gate.py --release > release-check.json 2> release-check.stderr
          result=$?
          set -e
          if [ "$result" -ne 1 ]; then
            echo "::error::Expected controlled release denial (exit 1), got $result"
            cat release-check.stderr
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("release-check.json").read_text())
          errors = report.get("errors")
          assert report.get("mode") == "release", "Incorrect gate mode"
          assert report.get("independent_approval_inferred") is False, "Approval inferred"
          assert isinstance(errors, list) and len(errors) == 1, "Unexpected validation errors"
          assert errors[0].startswith("RELEASE BLOCKED:"), "Not an explicit release denial"
          print("Verified controlled, explicit release denial; no independent approval inferred.")
          PY

  node-level-structural:
    name: Node cross-level structural / ${{ matrix.level }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        level: [A1, A2, B1, B2, C1]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check 200 provisional entries and matching global task IDs
        env:
          CEFR_LEVEL: ${{ matrix.level }}
        run: node scripts/cefr-1000-level-structural-qa.cjs

  node-release-blocker:
    name: Node approved-manifest release denial
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require explicit fail-closed staging result
        shell: bash
        run: |
          set +e
          node scripts/cefr-1000-release-readiness-gate.cjs > node-release-check.json 2> node-release-check.stderr
          result=$?
          set -e
          if [ "$result" -ne 1 ]; then
            echo "::error::Expected release gate to block with exit 1, got $result"
            cat node-release-check.stderr
            exit 1
          fi
          node - <<'JS'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const report = JSON.parse(fs.readFileSync('node-release-check.json','utf8'));
          assert.equal(report.scope, 'CEFR-1000 ONLY');
          assert.equal(report.release, 'BLOCKED');
          assert.ok(Array.isArray(report.blockers) && report.blockers.length > 0);
          assert.ok(report.blockers.includes('missing independently approved release manifest'));
          assert.ok(report.blockers.includes('missing independent evidence register'));
          for(const level of ['A1','A2','B1','B2','C1']){
            assert.equal(report.provisional_by_level[level], 200);
            assert.equal(report.independent_approvals_claimed_by_provisional[level], 0);
          }
          console.log('Node release denial verified; this is NOT independent approval or deployment.');
          JS
