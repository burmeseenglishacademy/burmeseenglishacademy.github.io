name: CEFR-1000 staging structural QA
on:
  push:
    branches:
      - cefr-5000-bilingual-qa-staging
    paths:
      - 'draft/CEFR-1000-*.json'
      - 'scripts/cefr1000_staging_gate.py'
      - 'scripts/cefr1000_negative_tests.py'
      - '.github/workflows/cefr-1000-structural-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  structural:
    name: Structural integrity / ${{ matrix.level }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        level: [A1, A2, B1, B2, C1]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check provisional inventory and review-task integrity
        run: python scripts/cefr1000_staging_gate.py --level "${{ matrix.level }}"
  mutation-tests:
    name: Reject corrupted provisional data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run eight fail-closed mutation checks
        run: python scripts/cefr1000_negative_tests.py
  release-blocker:
    name: Assert unverified release remains blocked
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify release gate fails closed
        shell: bash
        run: |
          if python scripts/cefr1000_staging_gate.py --release; then
            echo "::error::Release gate unexpectedly passed"
            exit 1
          fi
          echo "Release gate correctly blocked unverified publication."
