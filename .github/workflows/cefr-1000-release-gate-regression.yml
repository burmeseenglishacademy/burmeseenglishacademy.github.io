name: CEFR 1000 release gate adversarial regression (staging only)
on:
  push:
    branches: [cefr-5000-bilingual-qa-staging]
    paths:
      - 'scripts/cefr1000_release_gate.py'
      - 'tests/test_cefr1000_release_gate.py'
      - 'tests/test_cefr1000_level_lane.py'
      - '.github/workflows/cefr-1000-release-gate-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  adversarial:
    name: "Fail-closed regression / ${{ matrix.level }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        level: [A1, A2, B1, B2, C1]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Execute shared cross-level mutation suite (synthetic evidence only)
        run: python3 -m unittest discover -s tests -p 'test_cefr1000_release_gate.py' -v
      - name: Execute actual CEFR-level mutation suite for this lane
        env:
          CEFR_QA_LEVEL: ${{ matrix.level }}
        run: python3 -m unittest discover -s tests -p 'test_cefr1000_level_lane.py' -v
      - name: Audit actual frozen shortlist inventory and fail-closed holds for this level
        env:
          CEFR_QA_LEVEL: ${{ matrix.level }}
        run: |
          python3 - <<'PY'
          import collections, json, os
          from pathlib import Path
          level = os.environ['CEFR_QA_LEVEL']
          p = Path('draft/CEFR-1000-PROVISIONAL-SHORTLIST.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          entries = data['entries']
          assert len(entries) == 1000, 'Actual shortlist not exactly 1000'
          counts = collections.Counter(e['level'] for e in entries)
          assert counts == {x: 200 for x in ('A1','A2','B1','B2','C1')}, counts
          keys = [(e['word'].strip().casefold(), e['part_of_speech'].strip().casefold()) for e in entries]
          assert len(set(keys)) == len(keys), 'Duplicate headword/POS in actual shortlist'
          lane = [e for e in entries if e['level'] == level]
          assert len(lane) == 200
          assert all(e.get('editorial_hold') is True and e.get('release_approved') is False for e in lane), 'Provisional entry unexpectedly cleared'
          assert all(not e.get(k) for e in lane for k in ('reviewed_english','reviewed_burmese','reviewed_example','reviewed_level','reviewed_pronunciation')), 'Provisional review flags unexpectedly set'
          assert data.get('independently_approved_by_level',{}).get(level) == 0
          print(f'PASS actual provisional {level}: 200 written, 0 independently approved, all held; NOT release-ready')
          PY
      - name: Verify provisional shortlist cannot be certified without human evidence
        run: |
          python3 - <<'PY'
          import importlib.util, pathlib
          p=pathlib.Path('scripts/cefr1000_release_gate.py')
          spec=importlib.util.spec_from_file_location('release_gate',p)
          m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          candidate={'entries':[]}
          missing={'independent_reviews':{},'audio':{},'release_gates':{}}
          errors=m.check(candidate,missing)
          assert errors, 'Fail-open: empty manifest/evidence accepted'
          assert any('exactly 1000' in e for e in errors)
          print('PASS: missing approvals/audio/device/hosting evidence cannot certify release')
          PY
      - name: Declare scope
        run: |
          echo 'Executed shared checks plus actual mutation tests for CEFR lane ${{ matrix.level }}.'
          echo 'These checks are structural synthetic regressions, NOT linguistic/audio review.'
          echo 'No release, deploy, production write, or reviewer approval occurs.'
