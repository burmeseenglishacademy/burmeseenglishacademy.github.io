name: CEFR batch05 editorial queue integrity (never deploy)
on:
  push:
    branches: [cefr-5000-bilingual-qa-staging]
    paths:
      - 'draft/A2-C1-REVIEW-TASKS-BATCH05.json'
      - 'draft/A2-C1-EDITORIAL-STARTER.json'
      - 'draft/A2-C1-CANDIDATE-QUARANTINE.json'
      - 'tools/audit_cefr_batch05_review_tasks.py'
      - '.github/workflows/cefr-batch05-review-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pending-review-queue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check batch05 source-task separation and quarantine
        run: python3 tools/audit_cefr_batch05_review_tasks.py
