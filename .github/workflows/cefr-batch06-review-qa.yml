name: CEFR batch06 editorial queue integrity (never deploy)
on:
  push:
    branches: [cefr-5000-bilingual-qa-staging]
    paths:
      - draft/A2-C1-EDITORIAL-STARTER.json
      - draft/A2-C1-REVIEW-TASKS-BATCH06.json
      - draft/A2-C1-CANDIDATE-QUARANTINE.json
      - tools/audit_cefr_batch06_review_tasks.py
      - .github/workflows/cefr-batch06-review-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pending-review-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fail closed on unverified batch06 review tasks
        run: python3 tools/audit_cefr_batch06_review_tasks.py
