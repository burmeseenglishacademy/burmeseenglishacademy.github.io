name: CEFR batch09 parallel bilingual draft QA (never deploy)
on:
  push:
    branches: [cefr-5000-bilingual-qa-staging]
    paths:
      - draft/A2-C1-EDITORIAL-STARTER.json
      - draft/A2-C1-EDITORIAL-BATCH09.json
      - draft/A2-C1-REVIEW-TASKS-BATCH09.json
      - draft/A2-C1-CANDIDATE-QUARANTINE.json
      - tools/audit_cefr_batch09_review_tasks.py
      - .github/workflows/cefr-batch09-review-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  draft-and-review-structure:
    strategy:
      fail-fast: false
      matrix:
        level: [A2, B1, B2, C1, ALL]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Structural and quarantine checks only (no independent approval)
        run: python3 tools/audit_cefr_batch09_review_tasks.py --level ${{ matrix.level }}
