  workflow_dispatch:
permissions:
  contents: read
jobs:
  level-review-shortlist-structure:
    strategy:
      fail-fast: false
      matrix:
        level: [A1, A2, B1, B2, C1, ALL]
    name: 1000-word structural preflight ${{ matrix.level }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Check independent-task parity, provenance, cross-level holds and safe staging
        run: python3 tools/audit_cefr_1000_shortlist.py --level "${{ matrix.level }}"
      - name: Reject fake approval or duplicate word in negative tests
        if: ${{ matrix.level == 'ALL' }}
        run: python3 tools/audit_cefr_1000_shortlist.py --level ALL --self-test
      - name: Audit Oxford 3000/5000 CEFR-POS level discrepancies without automatic retiering
        run: python3 tools/audit_cefr_1000_oxford_discrepancy.py --level "${{ matrix.level }}"
      - name: Validate directly observed official Oxford PDF CEFR-POS spotchecks (not human signoff)
        run: python3 tools/audit_cefr_1000_oxford_direct_spotcheck.py --level "${{ matrix.level }}"
      - name: Reject forged PDF provenance, level drift and fake independent approval
        if: ${{ matrix.level == 'ALL' }}
        run: python3 tools/audit_cefr_1000_oxford_direct_spotcheck.py --level ALL --self-test
      - name: Validate twelve direct Oxford A1 word-POS observations without independent signoff
        run: python3 tools/audit_cefr_1000_oxford_a1_twelve.py --level "${{ matrix.level }}"
      - name: Reject 15 forged A1 publisher, Myanmar, and independent-review mutations
        if: ${{ matrix.level == 'ALL' }}
        run: python3 tools/audit_cefr_1000_oxford_a1_twelve.py --level ALL --self-test
      - name: Audit second twelve direct Oxford A1 word-POS observations (not human review)
        run: python3 tools/audit_cefr_1000_oxford_a1_second_twelve.py --level "${{ matrix.level }}"
      - name: Reject 26 forged A1 publisher, Myanmar, example and signoff mutations
        if: ${{ matrix.level == 'ALL' }}
        run: python3 tools/audit_cefr_1000_oxford_a1_second_twelve.py --level ALL --self-test
      - name: Audit third twelve Oxford A1 word-POS leads and noun-adverb mismatch (not independent review)
        run: python3 tools/audit_cefr_1000_oxford_a1_third_twelve.py --level "${{ matrix.level }}"
      - name: Reject 28 forged third-batch Oxford A1 provenance, bilingual and review mutations
        if: ${{ matrix.level == 'ALL' }}
        run: python3 tools/audit_cefr_1000_oxford_a1_third_twelve.py --level ALL --self-test
      - name: Audit 24 directly observed Oxford A1 word-POS leads and bilingual risks (not approval)
        run: python3 tools/audit_cefr_1000_oxford_a1_fourth_twentyfour.py --level "${{ matrix.level }}"
      - name: Reject 48 forged fourth-batch A1 source, Myanmar, homograph and review mutations
        if: ${{ matrix.level == 'ALL' }}
        run: python3 tools/audit_cefr_1000_oxford_a1_fourth_twentyfour.py --level ALL --self-test
      - name: Audit 24 new A1 Oxford publisher word-POS observations and six held rewrites
        run: python3 tools/audit_cefr_1000_oxford_a1_fifth_twentyfour.py --level "${{ matrix.level }}"
      - name: Reject 124 forged A1 publisher, bilingual, upstream and approval mutations
        if: ${{ matrix.level == 'ALL' }}
        run: python3 tools/audit_cefr_1000_oxford_a1_fifth_twentyfour.py --level ALL --self-test
      - name: Audit sixth A1 Oxford 24 leads and verify 100 distinct observed A1 word-POS entries
        run: python3 tools/audit_cefr_1000_oxford_a1_sixth_twentyfour.py --level "${{ matrix.level }}"
      - name: Reject 212 sixth-batch forged source, Myanmar, provenance and reviewer mutations
        if: ${{ matrix.level == 'ALL' }}
        run: python3 tools/audit_cefr_1000_oxford_a1_sixth_twentyfour.py --level ALL --self-test
      - name: Verify 12 new A1 Oxford preposition/question-word observations and 112 distinct A1 source leads
        run: python3 tools/audit_cefr_1000_oxford_a1_seventh_twelve.py --level "${{ matrix.level }}"
      - name: Reject 250 forged A1 publisher, Myanmar, example, provenance, and approval mutations
        if: ${{ matrix.level == 'ALL' }}
        run: python3 tools/audit_cefr_1000_oxford_a1_seventh_twelve.py --level ALL --self-test
      - name: Audit eighth A1 Oxford twelve temporal/family word-POS observations and grammar risks
        run: python3 tools/audit_cefr_1000_oxford_a1_eighth_twelve.py --level "${{ matrix.level }}"
      - name: Reject 144 forged eighth A1 source, Myanmar, example, task and approval mutations
        if: ${{ matrix.level == 'ALL' }}
        run: python3 tools/audit_cefr_1000_oxford_a1_eighth_twelve.py --level ALL --self-test
      - name: Audit ninth A1 Oxford family/home word-POS evidence (no human approval)
        run: python3 tools/audit_cefr_1000_oxford_a1_ninth_twelve.py --level "${{ matrix.level }}"
      - name: Reject 221 forged ninth A1 source, bilingual and independent-review mutations
        if: ${{ matrix.level == 'ALL' }}
        run: python3 tools/audit_cefr_1000_oxford_a1_ninth_twelve.py --level ALL --self-test
      - name: Audit tenth A1 question and colour Oxford PDF word-POS evidence (not independent review)
        run: python3 tools/audit_cefr_1000_oxford_a1_tenth_twelve.py --level "${{ matrix.level }}"
      - name: Reject 238 forged tenth A1 source, grammar, Myanmar and reviewer mutations
        if: ${{ matrix.level == 'ALL' }}
        run: python3 tools/audit_cefr_1000_oxford_a1_tenth_twelve.py --level ALL --self-test
      - name: Audit eleventh A1 concrete-noun Oxford PDF word-POS evidence (not independent review)
        run: python3 tools/audit_cefr_1000_oxford_a1_eleventh_twelve.py --level "${{ matrix.level }}"
      - name: Reject 238 forged eleventh A1 source, Myanmar, grammar and reviewer mutations
        if: ${{ matrix.level == 'ALL' }}
        run: python3 tools/audit_cefr_1000_oxford_a1_eleventh_twelve.py --level ALL --self-test
      - name: Audit twelve Cambridge A1 sense leads and four unresolved Oxford conflicts (not human signoff)
        run: python3 tools/audit_cefr_1000_cambridge_a1_twelve.py --level "${{ matrix.level }}"
      - name: Reject 234 forged A1 Cambridge, Oxford, Myanmar, provenance and reviewer mutations
        if: ${{ matrix.level == 'ALL' }}
        run: python3 tools/audit_cefr_1000_cambridge_a1_twelve.py --level ALL --self-test
      - name: Reconcile all Oxford packets across five levels, including legacy evidence schemas
        run: python3 tools/audit_cefr_1000_oxford_coverage.py --level "${{ matrix.level }}"
      - name: Reject 16 forged cross-batch Oxford source, bilingual and reviewer mutations
        if: ${{ matrix.level == 'ALL' }}
        run: python3 tools/audit_cefr_1000_oxford_coverage.py --level ALL --self-test
      - name: Verify 36 direct Oxford PDF excerpts recovered from immutable historical locator-only packets
        run: python3 tools/audit_cefr_1000_oxford_legacy_excerpt_recovery.py --level "${{ matrix.level }}"
      - name: Reject 20 forged recovered Oxford excerpts, provenance and fake reviewer receipts
        if: ${{ matrix.level == 'ALL' }}
        run: python3 tools/audit_cefr_1000_oxford_legacy_excerpt_recovery.py --level ALL --self-test
      - name: Produce provenance-bound independent-review priority counts (no approvals)
        run: python3 tools/audit_cefr_1000_review_priority.py --level "${{ matrix.level }}"
      - name: Generate full 1000-item reviewer handoff and reject forged signoffs
        if: ${{ matrix.level == 'ALL' }}
        run: python3 tools/audit_cefr_1000_review_priority.py --level ALL --self-test --output cefr-1000-review-handoff-ALL.json
      - name: Validate 1000-item reviewer handoff against frozen source fields and provenance
        run: python3 tools/audit_cefr_1000_handoff_integrity.py --level "${{ matrix.level }}"
      - name: Reject 145 count-preserving forged handoff edits and validate actual exported artifact
        if: ${{ matrix.level == 'ALL' }}
        run: python3 tools/audit_cefr_1000_handoff_integrity.py --level ALL --report cefr-1000-review-handoff-ALL.json --self-test
      - name: Audit Oxford A2 follow-up twelve publisher word/POS observations (not independent signoff)
        run: python3 tools/audit_cefr_1000_oxford_a2_followup_twelve.py --level "${{ matrix.level }}"
      - name: Reject 24 forged Oxford A2 follow-up source, snapshot and review mutations
        if: ${{ matrix.level == 'ALL' }}
        run: python3 tools/audit_cefr_1000_oxford_a2_followup_twelve.py --level ALL --self-test
      - name: Audit 24 further Oxford A2 draft word/POS observations
        run: python3 tools/audit_cefr_1000_oxford_a2_third_twentyfour.py --level "${{ matrix.level }}"
      - name: Reject 48 forged Oxford A2 source and false-signoff mutations
        if: ${{ matrix.level == 'ALL' }}
        run: python3 tools/audit_cefr_1000_oxford_a2_third_twentyfour.py --level ALL --self-test
      - name: Audit fourth Oxford A2 twelve word/POS observations (no approvals)
        run: python3 tools/audit_cefr_1000_oxford_a2_fourth_twelve.py --level "${{ matrix.level }}"
      - name: Reject 80 forged A2 publisher, Myanmar, example and false-review mutations
        if: ${{ matrix.level == 'ALL' }}
        run: python3 tools/audit_cefr_1000_oxford_a2_fourth_twelve.py --level ALL --self-test
      - name: Audit fifth A2 twelve direct Oxford word-POS observations (never approval)
        run: python3 tools/audit_cefr_1000_oxford_a2_fifth_twelve.py --level "${{ matrix.level }}"
      - name: Reject 306 forged fifth A2 source, bilingual and reviewer mutations
        if: ${{ matrix.level == 'ALL' }}
        run: python3 tools/audit_cefr_1000_oxford_a2_fifth_twelve.py --level ALL --self-test
      - name: Audit 12 A2 English Myanmar example rewrite proposals (not approved)
        run: python3 tools/audit_cefr_1000_a2_rewrites.py --level "${{ matrix.level }}"
      - name: Reject 24 forged A2 bilingual rewrite and approval mutations
        if: ${{ matrix.level == 'ALL' }}
        run: python3 tools/audit_cefr_1000_a2_rewrites.py --level ALL --self-test
      - name: Audit twelve A2 historical source-recovery publisher leads (zero signoff)
        run: python3 tools/audit_cefr_1000_a2_recovery_twelve.py --level "${{ matrix.level }}"
      - name: Reject fourteen A2 recovery forged CEFR, Myanmar, source and approval mutations
        if: ${{ matrix.level == 'ALL' }}
        run: python3 tools/audit_cefr_1000_a2_recovery_twelve.py --level ALL --self-test
      - name: Audit twelve Oxford A2-draft direct PDF word-POS observations and cross-level conflicts
        run: python3 tools/audit_cefr_1000_oxford_a2_twelve.py --level "${{ matrix.level }}"
      - name: Reject 15 forged A2-draft publisher observations, Myanmar drift and fake signoffs
        if: ${{ matrix.level == 'ALL' }}
        run: python3 tools/audit_cefr_1000_oxford_a2_twelve.py --level ALL --self-test
      - name: Audit four Oxford/Cambridge cross-publisher sense-vs-word-POS reconciliations
        run: python3 tools/audit_cefr_1000_cross_publisher_four.py --level "${{ matrix.level }}"
      - name: Reject 17 forged cross-publisher sources, changed Myanmar and false signoffs
        if: ${{ matrix.level == 'ALL' }}
        run: python3 tools/audit_cefr_1000_cross_publisher_four.py --level ALL --self-test
      - name: Audit seven Cambridge cross-level sense and bilingual example discrepancies (staging only)
        run: python3 tools/audit_cefr_1000_cambridge_crosslevel_seven.py --level "${{ matrix.level }}"
      - name: Reject thirteen Cambridge cross-level source and fake-approval mutations
        if: ${{ matrix.level == 'ALL' }}
        run: python3 tools/audit_cefr_1000_cambridge_crosslevel_seven.py --level ALL --self-test
      - name: Audit twelve B1-draft direct Oxford PDF word-POS source observations (not exact-sense signoff)
        run: python3 tools/audit_cefr_1000_oxford_b1_twelve.py --level "${{ matrix.level }}"
      - name: Reject forged B1 publisher metadata, Myanmar drift and fake independent review
        if: ${{ matrix.level == 'ALL' }}
        run: python3 tools/audit_cefr_1000_oxford_b1_twelve.py --level ALL --self-test
      - name: Audit twelve additional direct Oxford B1-draft word/POS conflicts (not exact-sense approval)
        run: python3 tools/audit_cefr_1000_oxford_b1_lower_twelve.py --level "${{ matrix.level }}"
      - name: Reject 26 fabricated Oxford PDF, Myanmar, example and reviewer mutations
        if: ${{ matrix.level == 'ALL' }}
        run: python3 tools/audit_cefr_1000_oxford_b1_lower_twelve.py --level ALL --self-test
      - name: Audit twelve Oxford B1 mixed lower/matching/higher word-POS observations
        run: python3 tools/audit_cefr_1000_oxford_b1_mixed_twelve.py --level "${{ matrix.level }}"
      - name: Reject forged Oxford B1 mixed-level source, Myanmar and fake reviewer receipts
        if: ${{ matrix.level == 'ALL' }}
        run: python3 tools/audit_cefr_1000_oxford_b1_mixed_twelve.py --level ALL --self-test
      - name: Audit 24 more Oxford B1-draft source and bilingual snapshots (not human approval)
        run: python3 tools/audit_cefr_1000_oxford_b1_fourth_twentyfour.py --level "${{ matrix.level }}"
      - name: Reject 113 forged B1 Oxford/Cambridge, Myanmar and false-signoff mutations
        if: ${{ matrix.level == 'ALL' }}
        run: python3 tools/audit_cefr_1000_oxford_b1_fourth_twentyfour.py --level ALL --self-test
      - name: Audit B1 fifth twelve Oxford publisher word-POS observations
        run: python3 tools/audit_cefr_1000_oxford_b1_fifth_twelve.py --level "${{ matrix.level }}"
      - name: Reject 120 forged fifth B1 publisher, bilingual and reviewer mutations
        if: ${{ matrix.level == 'ALL' }}
        run: python3 tools/audit_cefr_1000_oxford_b1_fifth_twelve.py --level ALL --self-test
      - name: Audit B1 sixth twelve direct Oxford publisher word-POS observations under editorial hold
        run: python3 tools/audit_cefr_1000_oxford_b1_sixth_twelve.py --level "${{ matrix.level }}"
      - name: Reject 144 forged B1 sixth source, bilingual, provenance and false-review mutations
        if: ${{ matrix.level == 'ALL' }}
        run: python3 tools/audit_cefr_1000_oxford_b1_sixth_twelve.py --level ALL --self-test
      - name: Audit twelve B2-draft Oxford word-POS observations (no independent signoff)
        run: python3 tools/audit_cefr_1000_oxford_b2_twelve.py --level "${{ matrix.level }}"
      - name: Reject forged B2 PDF provenance, changed Myanmar and fake human approval
        if: ${{ matrix.level == 'ALL' }}
        run: python3 tools/audit_cefr_1000_oxford_b2_twelve.py --level ALL --self-test
      - name: Audit 24 additional B2 Oxford word/POS observations (staging only)
        run: python3 tools/audit_cefr_1000_oxford_b2_fourth_twentyfour.py --level "${{ matrix.level }}"
