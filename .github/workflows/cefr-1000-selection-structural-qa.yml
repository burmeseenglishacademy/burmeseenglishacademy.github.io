      - draft/CEFR-1000-CAMBRIDGE-B2-SIX-SENSE-LEADS-2026-10-28.json
      - draft/CEFR-1000-CAMBRIDGE-A2-EIGHT-SENSE-LEADS-2026-10-28.json
      - tools/audit_cefr_1000_cambridge_a2_eight.py
      - draft/CEFR-1000-CAMBRIDGE-B1-TWELVE-SENSE-LEADS-2026-10-28.json
      - draft/CEFR-1000-CAMBRIDGE-CROSSLEVEL-SEVEN-2026-10-28.json
      - draft/CEFR-1000-CROSS-PUBLISHER-FOUR-RECONCILIATION-2026-10-28.json
      - tools/audit_cefr_1000_cross_publisher_four.py
      - draft/CEFR-1000-CAMBRIDGE-C1-SIX-FOLLOWUP-2026-10-28.json
      - tools/audit_cefr_1000_cambridge_c1_six_followup.py
      - tools/audit_cefr_1000_cambridge_crosslevel_seven.py
