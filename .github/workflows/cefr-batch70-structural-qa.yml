name: CEFR batch70 bilingual structural and quarantine QA (never deploy)
on:
  push:
    branches: [cefr-5000-bilingual-qa-staging]
    paths:
      - draft/A2-C1-SOURCE-RECOVERY-EDITORIAL-BATCH70.json
      - draft/A2-C1-SOURCE-RECOVERY-REVIEW-TASKS-BATCH70.json
      - draft/A2-C1-SOURCE-RECOVERY-QUARANTINE-BATCH70.json
      - tools/audit_cefr_batch70_recovery.py
      - .github/workflows/cefr-batch70-structural-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  level-structural-quarantine:
    strategy:
      fail-fast: false
      matrix:
        level: [A2, B1, B2, C1, ALL]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check original bilingual drafts and reversible holds without approving any entries
        run: python3 tools/audit_cefr_batch70_recovery.py --level ${{ matrix.level }}
      - name: Protect 54 lessons IELTS 1000 George Emma audio and privacy
        if: ${{ matrix.level == 'ALL' }}
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin main
          changed="$(git diff --name-only origin/main HEAD -- content.js ielts-vocabulary-data.js audio-manifest.js audio-player.js audio-integration.js privacy-tools.js site-config.js audio/)"
          if [ -n "$changed" ]; then printf 'PRODUCTION ASSET DRIFT: %s\n' "$changed"; exit 1; fi
          echo 'PASS: protected production assets unchanged'
      - name: Archive structural triage, not editorial approval
        if: ${{ matrix.level == 'ALL' }}
        uses: actions/upload-artifact@v4
        with:
          name: batch70-structural-hold-report
          path: batch70-triage-results.json
          retention-days: 30
