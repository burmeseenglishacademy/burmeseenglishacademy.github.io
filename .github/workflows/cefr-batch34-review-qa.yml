name: CEFR batch34 parallel draft, independent-review-task and quarantine QA (never deploy)
on:
  push:
    branches: [cefr-5000-bilingual-qa-staging]
    paths:
      - draft/A2-C1-EDITORIAL-BATCH34.json
      - draft/A2-C1-REVIEW-TASKS-BATCH34.json
      - draft/A2-C1-QUARANTINE-BATCH34.json
      - tools/audit_cefr_batch34_review_tasks.py
      - .github/workflows/cefr-batch34-review-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  level-structural-review:
    strategy:
      fail-fast: false
      matrix:
        level: [A2, B1, B2, C1, ALL]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Validate unpublished batch34 bilingual drafts and independent-review tasks
        run: python3 tools/audit_cefr_batch34_review_tasks.py --level ${{ matrix.level }}
