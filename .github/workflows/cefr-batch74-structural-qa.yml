name: CEFR batch74 bilingual structural quarantine QA (never deploy)
on:
  push:
    branches: [cefr-5000-bilingual-qa-staging]
    paths:
      - draft/A2-C1-SOURCE-RECOVERY-EDITORIAL-BATCH74.json
      - draft/A2-C1-SOURCE-RECOVERY-REVIEW-TASKS-BATCH74.json
      - draft/A2-C1-SOURCE-RECOVERY-QUARANTINE-BATCH74.json
      - draft/BATCH74-CANDIDATE-TRIAGE.json
      - draft/BATCH74-CROSS-LEVEL-CANDIDATE-HOLDS.json
      - tools/audit_cefr_batch74_recovery.py
      - .github/workflows/cefr-batch74-structural-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  level-structural-quarantine:
    strategy:
      fail-fast: false
      matrix:
        level: [A2, B1, B2, C1, ALL]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check first-pass draft and quarantine integrity
        run: python3 tools/audit_cefr_batch74_recovery.py --level ${{ matrix.level }}
      - name: Protect production lessons IELTS bank George Emma audio and privacy
        if: ${{ matrix.level == 'ALL' }}
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin main
          changed="$(git diff --name-only origin/main HEAD -- content.js ielts-vocabulary-data.js audio-manifest.js audio-player.js audio-integration.js privacy-tools.js site-config.js audio/)"
          if [ -n "$changed" ]; then printf 'PRODUCTION ASSET DRIFT: %s\n' "$changed"; exit 1; fi
          echo 'PASS: protected production assets unchanged'
      - name: Archive nonpublishing structural report
        if: ${{ matrix.level == 'ALL' }}
        uses: actions/upload-artifact@v4
        with:
          name: batch74-structural-hold-report
          path: batch74-structural-hold-report.json
          retention-days: 30
