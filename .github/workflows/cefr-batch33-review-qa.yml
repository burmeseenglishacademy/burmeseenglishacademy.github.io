name: CEFR batch33 parallel bilingual draft and quarantine QA (never deploy)
on:
  push:
    branches: [cefr-5000-bilingual-qa-staging]
    paths:
      - draft/A2-C1-EDITORIAL-BATCH33.json
      - draft/A2-C1-REVIEW-TASKS-BATCH33.json
      - draft/A2-C1-QUARANTINE-BATCH33.json
      - tools/audit_cefr_batch33_review_tasks.py
      - .github/workflows/cefr-batch33-review-qa.yml
      - CEFR-A2-C1-BATCH33-CHECKPOINT-2026-10-25.md
  workflow_dispatch:
permissions:
  contents: read
jobs:
  level-structural-review:
    strategy:
      fail-fast: false
      matrix:
        level: [A2, B1, B2, C1, ALL]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Check unpublished batch33 bilingual drafts and quarantines
        run: python3 tools/audit_cefr_batch33_review_tasks.py --level ${{ matrix.level }}
