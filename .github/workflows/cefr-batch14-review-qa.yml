name: CEFR batch14 unique-headword and five-way draft QA (never deploy)
on:
  push:
    branches: [cefr-5000-bilingual-qa-staging]
    paths:
      - draft/A2-C1-EDITORIAL-BATCH14.json
      - draft/A2-C1-REVIEW-TASKS-BATCH14.json
      - draft/A2-C1-QUARANTINE-BATCH14.json
      - tools/audit_cefr_batch14_review_tasks.py
      - .github/workflows/cefr-batch14-review-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  level-structural-review:
    strategy:
      fail-fast: false
      matrix:
        level: [A2, B1, B2, C1, ALL]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check unverified batch14 and cross-file exact counts
        run: python3 tools/audit_cefr_batch14_review_tasks.py --level ${{ matrix.level }}
