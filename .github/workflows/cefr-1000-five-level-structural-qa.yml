name: CEFR-1000 five-level structural QA (staging only)
on:
  push:
    branches: [cefr-5000-bilingual-qa-staging]
    paths:
      - 'draft/CEFR-1000-PROVISIONAL-SHORTLIST.json'
      - 'draft/CEFR-1000-INDEPENDENT-REVIEW-TASKS.json'
      - 'scripts/cefr-1000-level-structural-qa.cjs'
      - 'scripts/cefr1000_provisional_intake_guard.py'
      - 'scripts/test_cefr1000_provisional_intake_guard.py'
      - 'scripts/test_cefr1000_provisional_intake_additional.py'
      - 'scripts/cefr1000_release_veto.py'
      - '.github/workflows/cefr-1000-five-level-structural-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  structural:
    name: Structural QA ${{ matrix.level }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        level: [A1, A2, B1, B2, C1]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check provisional inventory and review-task alignment
        env:
          CEFR_LEVEL: ${{ matrix.level }}
        run: node scripts/cefr-1000-level-structural-qa.cjs

  provisional-intake-refusal:
    name: Provisional intake and adversarial refusal tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify provisional intake remains on editorial hold
        run: python scripts/cefr1000_provisional_intake_guard.py
      - name: Test adversarial refusal scenarios (all provisional-intake suites)
        run: |
          python -m unittest discover -s scripts -p 'test_cefr1000_provisional_intake_guard.py' -v
          python -m unittest discover -s scripts -p 'test_cefr1000_provisional_intake_additional.py' -v

  release-veto-regression:
    name: Assert staging release remains denied
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Release veto must refuse publication
        shell: bash
        run: |
          set -uo pipefail
          # GitHub invokes bash with -e; temporarily disable it to capture the expected veto exit.
          set +e
          python scripts/cefr1000_release_veto.py > release-veto-output.txt 2>&1
          status=$?
          set -e
          cat release-veto-output.txt
          if [ "$status" -eq 0 ]; then
            echo "::error::Release veto unexpectedly exited successfully"
            exit 1
          fi
          if ! grep -Fq "CEFR-1000 RELEASE PERMISSION: DENIED (staging only)" release-veto-output.txt; then
            echo "::error::Release veto failed without explicit denial marker"
            exit 1
          fi
          if ! grep -Fq "RELEASE BLOCKED: 1000 independently signed" release-veto-output.txt; then
            echo "::error::Independent review veto missing"
            exit 1
          fi
          echo "PASS: release permission explicitly denied; this is NOT launch approval"
