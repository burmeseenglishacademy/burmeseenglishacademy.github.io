name: A1 500 bilingual draft full staging regression (never deploys)
on:
  push:
    branches: [cefr-5000-bilingual-qa-staging]
    paths:
      - .github/workflows/cefr-a1-final-gate.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrated-a1-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm A1 500 word sense drafts match all 5000 provisional CEFR candidates
        run: python3 tests/cefr-editorial-draft.py
      - name: Require 500 unique original A1 entries with no structural faults
        run: python3 tools/audit_a1_500_drafts.py
      - name: No learner release allowed for unreviewed draft data
        run: |
          python3 - <<'PY'
          import json
          c=json.load(open('draft/UNVERIFIED_CEFR_CANDIDATES.json'))
          s=json.load(open('draft/A1-EDITORIAL-STARTER.json'))
          assert len(s['entries'])==500
          assert len(c['entries'])==5000
          assert all(x.get('editorial_status')=='HAND_AUTHORED_PENDING_SECOND_REVIEW' for x in c['entries'][:500])
          assert all(not x['reviewed_burmese'] and not x['reviewed_english'] for x in s['entries'])
          assert all(not x['reviewed_pronunciation'] for x in s['entries'])
          assert c['release_status']=='UNVERIFIED_DRAFT_DO_NOT_PUBLISH'
          print('PASS exact 500 A1 drafts; content/audio NOT falsely certified')
          PY
      - name: Check browser JS and CEFR 5000-word synthetic interaction safety
        run: |
          for f in script.js cefr-vocabulary.js cefr-vocabulary-data.js audio-player.js audio-integration.js tests/cefr-ui.cjs; do node --check "$f"; done
          node tests/cefr-ui.cjs
      - name: Confirm unchanged released Academy lessons IELTS and Kokoro assets
        run: node tests/production-static.cjs
